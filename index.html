<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Birthday Message</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #fdf2f8; }
        button { padding: 20px 40px; font-size: 1.2rem; cursor: pointer; background: #db2777; color: white; border: none; border-radius: 50px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #9d174d; }
    </style>
</head>
<body>
    <h1 id="greeting">Happy Birthday! 🎂</h1>
    <p>Please click below to listen to your message:</p>
    
    <button onclick="playAudio()">Play Message 🎵</button>

    <audio id="myAudio"></audio>

    <script>
        const params = new URLSearchParams(window.location.search);
        const person = params.get('who');
        const audio = document.getElementById('myAudio');
        const greeting = document.getElementById('greeting');

        if (person) {
            // This links to your file, e.g., "nicolas.mp3"
            audio.src = person + ".mp3";
            greeting.innerText = "Message from " + person.charAt(0).toUpperCase() + person.slice(1) + " ✨";
        } else {
            greeting.innerText = "Error: No name found!";
        }

        function playAudio() {
            audio.play().catch(e => alert("Please tap the screen first to allow audio!"));
        }
    </script>
</body>
</html>
